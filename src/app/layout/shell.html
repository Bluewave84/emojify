<a class="skip-link" href="#inhalt">Zum Inhalt springen</a>

<header class="bar">
  <div class="bar__inner">
    <a class="brand" routerLink="/">Emojify</a>

    <a routerLink="/analysis">Analysis</a>
    <tui-icon icon="@tui-sun"></tui-icon>
    <button tuiButton size="s" type="button" (click)="theme.toggle()">
      @if (theme.theme() === "dark") {
        <tui-icon icon="@tui-moon"></tui-icon>
      } @else {
        <tui-icon icon="@tui-sun"></tui-icon>
      }
      {{ theme.theme() === "dark" ? "Light" : "Dark" }}
    </button>
  </div>
</header>

<main id="inhalt" class="main">
  <router-outlet />
</main>
